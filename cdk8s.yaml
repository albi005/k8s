language: typescript

# https://cdk8s.io/docs/latest/cli/import/#import-types
imports:
  - k8s@1.36.0 # https://github.com/cdk8s-team/cdk8s/tree/master/kubernetes-schemas

  # Helm charts, pinned to the versions in each app's kustomization.yaml:
  #   helm:<repo-url>/<chart>@<version>   https://cdk8s.io/docs/latest/cli/import/#helm-charts
  # Argo CD (argocd/kustomization.yaml)
  - helm:oci://ghcr.io/argoproj/argo-helm/argo-cd@9.3.4
  # cert-manager (cert-manager/kustomization.yaml)
  - helm:oci://quay.io/jetstack/charts/cert-manager@v1.19.2
  # CloudNativePG (cnpg/kustomization.yaml)
  - helm:https://cloudnative-pg.github.io/charts/cloudnative-pg@0.27.0
  # CloudNativePG barman-cloud plugin (cnpg-barman-cloud-plugin/kustomization.yaml)
  - helm:https://cloudnative-pg.io/charts/plugin-barman-cloud@0.4.0
  # kube-prometheus-stack (kube-prometheus-stack/kustomization.yaml)
  - helm:https://prometheus-community.github.io/helm-charts/kube-prometheus-stack@81.2.0
  # Grafana Loki (loki/kustomization.yaml)
  - helm:https://grafana.github.io/helm-charts/loki@6.49.0
  # Grafana Tempo (tempo/kustomization.yaml)
  - helm:https://grafana.github.io/helm-charts/tempo@1.24.3
  # Traefik (traefik/kustomization.yaml)
  - helm:https://traefik.github.io/charts/traefik@39.0.0
  # OpenTelemetry Collector (opentelemetry-collector/kustomization.yaml)
  - helm:https://open-telemetry.github.io/opentelemetry-helm-charts/opentelemetry-collector@0.143.0

  # CRDs installed by the charts above (the helm construct only renders the chart's
  # templates, so CRD kinds need separate imports). Each import must be a single
  # file/URL containing all CRDs of an API group, because cdk8s writes one module
  # per group and overwrites it for every import entry.
  # (https://cdk8s.io/docs/latest/cli/import/#crds)
  #
  # argoproj.io            v3.2.5  argo-cd chart 9.3.4 (full install manifest; cdk8s imports only the CRDs)
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.5/manifests/install.yaml
  # cert-manager.io + acme.cert-manager.io  v1.19.2  cert-manager chart v1.19.2
  - https://github.com/cert-manager/cert-manager/releases/download/v1.19.2/cert-manager.crds.yaml
  # postgresql.cnpg.io      v1.28.0  cloudnative-pg chart 0.27.0
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.28.0/releases/cnpg-1.28.0.yaml
  # barmancloud.cnpg.io     v0.10.0  plugin-barman-cloud chart 0.4.0
  - https://raw.githubusercontent.com/cloudnative-pg/plugin-barman-cloud/v0.10.0/config/crd/bases/barmancloud.cnpg.io_objectstores.yaml
  # monitoring.coreos.com   v0.88.0  kube-prometheus-stack chart 81.2.0 (full operator bundle; cdk8s imports only the CRDs)
  - https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.88.0/bundle.yaml
  # traefik.io                      traefik chart 39.0.0
  - https://raw.githubusercontent.com/traefik/traefik/v3.6.7/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
  
