# https://github.com/argoproj/argo-helm
# https://artifacthub.io/packages/helm/argo-cd-oci/argo-cd

namespace: argocd

resources:
  - namespace.yaml

helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm
    version: 9.3.4
    releaseName: argocd
    apiVersions:
      - monitoring.coreos.com/v1
    # https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd#general-parameters
    # or scroll down to "General parameters" on artifacthub
    # or https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
    valuesInline:
      configs:
        cm:
          # https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/#kustomizing-helm-charts
          kustomize.buildOptions: "--enable-helm"

        # Sidecar Config Management Plugin for cdk8s apps.
        # Any top-level directory containing a `cdk8s.yaml` is synthesized with cdk8s.
        # https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
        cmp:
          create: true
          plugins:
            cdk8s:
              discover:
                fileName: "cdk8s.yaml"
              generate:
                command: [sh, -c]
                args:
                  - |
                    set -e
                    if [ -f bun.lock ]; then bun install --frozen-lockfile >&2; else bun install >&2; fi
                    bun run import >&2
                    bun run synth >&2
                    cat dist/*.k8s.yaml

      global:
        networkPolicy:
          create: true
      
      # resource requests/limits are from https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
      # nvm they are useless
      controller:
        resources:
          limits:
            cpu: 500m
            memory: 900Mi
            ephemeral-storage: 200M
          requests:
            cpu: 250m
            memory: 287Mi
            ephemeral-storage: 0
      dex:
        initImage:
          resources:
            limits:
              cpu: 110m
              memory: 128Mi
              ephemeral-storage: 600M
            requests:
              cpu: 110m
              memory: 64Mi
              ephemeral-storage: 0
        resources:
          limits:
            cpu: 150m
            memory: 200Mi
            ephemeral-storage: 400Mi
          requests:
            cpu: 10m
            memory: 32Mi
            ephemeral-storage: 100Mi
      redis:
        resources:
          limits:
            cpu: 500m
            memory: 300Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 0
      redisSecretInit:
        resources:
          limits:
            cpu: 400m
            memory: 64Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 32Mi
            ephemeral-storage: 0
      server:
        extensions:
          resources:
            limits:
              cpu: 150m
              memory: 128Mi
              ephemeral-storage: 200M
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
        resources:
          limits:
            cpu: 500m
            memory: 600Mi
            ephemeral-storage: 200M
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 50Mi
      repoServer:
        copyutil:
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 600M
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 50Mi

        # Sidecar running the `cdk8s` CMP. Image only needs bun; cdk8s + cdk8s-cli
        # are installed per-app by `bun install` in the generate command above.
        extraContainers:
          - name: cmp-cdk8s
            command: ["/var/run/argocd/argocd-cmp-server"]
            image: oven/bun:1
            imagePullPolicy: IfNotPresent
            env:
              # bun needs a writable HOME for its install cache; /tmp is the cmp-tmp emptyDir.
              - name: HOME
                value: /tmp
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
            volumeMounts:
              - mountPath: /var/run/argocd
                name: var-files
              - mountPath: /home/argocd/cmp-server/plugins
                name: plugins
              - mountPath: /home/argocd/cmp-server/config/plugin.yaml
                subPath: cdk8s.yaml
                name: argocd-cmp-cm
              # Do not share the repo-server's /tmp volume (path traversal mitigation).
              - mountPath: /tmp
                name: cmp-tmp

        volumes:
          - name: argocd-cmp-cm
            configMap:
              name: argocd-cmp-cm
          - name: cmp-tmp
            emptyDir: {}

        resources:
          limits:
            cpu: 700m
            memory: 700Mi
            ephemeral-storage: 400Mi
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 100Mi
      applicationSet:
        resources:
          limits:
            cpu: 500m
            memory: 600Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 100Mi
            ephemeral-storage: 0
      notifications:
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 0
