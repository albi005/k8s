webhook:
  enabled: true
  certManager:
    # cert-manager is already installed; use a self-signed Issuer for the
    # webhook serving certificate instead of the install-time certgen hook Job,
    # which does not run as a real Helm hook under ArgoCD/kustomize.
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 50Mi
    ephemeral-storage: 0
  limits:
    cpu: 500m
    memory: 500Mi
    ephemeral-storage: 500Mi
